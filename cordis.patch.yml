# dsh-sidebar-width bundle patch
#
# `dsh.bundle.patch` layer: installing this package appends `dsh-sidebar-width`
# to `dsh.profile.bundles`, and profile boot merges this patch as one plugin row.
#
# `id` is the profile row id and doubles as the Host settings namespace;
# keep it stable so persisted config is never orphaned.
- insert:
    - id: sidebar-width
      name: dsh-sidebar-width
