url: https://github.com/nullifyi/dsh-sidebar-width
name: nullifyi/dsh-sidebar-width
category: ui
description:
  en: Adds VS Code-style sash dividers to the DSH sidebar, so the boundary between any two sidebar blocks, and between individual rows, can be dragged to resize; squeezed content scales down with its container, and each block can be collapsed into an icon stacked above the avatar.
  zh: 给 DSH 侧栏加上 VS Code 式分割条：任意两个区块之间、以及每一行之间都能拖动调高，空间被压小时内容跟着等比缩小，每个区块还能折叠成堆在头像上方的图标。
